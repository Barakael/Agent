# Wayda — HTTP-only bootstrap (use before certbot)
# On VPS: cd /home/teratech/messaging/Wayda && bash deploy/messaging/setup-https.sh

server {
    listen 80;
    server_name wayda.teratech.co.tz wayda.teratech;

    access_log /var/log/nginx/wayda.teratech.co.tz_access.log;
    error_log /var/log/nginx/wayda.teratech.co.tz_error.log;

    client_max_body_size 12M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Static frontend (under /var/www — readable by nginx www-data)
    root /var/www/wayda;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
