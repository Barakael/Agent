# Wayda Messaging — nginx reverse proxy with HTTPS
# Install: sudo cp deploy/messaging/nginx-wayda.conf /etc/nginx/sites-available/wayda.teratech.co.tz.conf
#          sudo ln -sf /etc/nginx/sites-available/wayda.teratech.co.tz.conf /etc/nginx/sites-enabled/
# Cert:    sudo certbot --nginx -d wayda.teratech.co.tz
# Test:    sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name wayda.teratech.co.tz wayda.teratech;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wayda.teratech.co.tz wayda.teratech;

    access_log /var/log/nginx/wayda.teratech.co.tz_access.log;
    error_log /var/log/nginx/wayda.teratech.co.tz_error.log;

    ssl_certificate /etc/letsencrypt/live/wayda.teratech.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wayda.teratech.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12M;

    # Laravel API (PM2 artisan serve :8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Static frontend build
    root /var/www/wayda;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
