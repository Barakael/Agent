# Host nginx — loopback + mailcow docker gateway (172.22.1.1)
# Mailcow proxies wayda.co.tz → http://172.22.1.1:8088
# Requires DOCKER-USER ACCEPT for 172.22.1.0/24 → 172.22.1.1:8088
server {
    listen 127.0.0.1:8088;
    listen 172.22.1.1:8088;
    server_name wayda.co.tz www.wayda.co.tz;

    root /etc/bin/agent/frontend/dist;
    index index.html;
    client_max_body_size 12M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
