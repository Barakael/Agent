# Mailcow custom site — place as:
#   /opt/mailcow-dockerized/data/conf/nginx/wayda.co.tz.conf
# then: docker compose restart nginx-mailcow
#
# Proxies public HTTPS for wayda.co.tz to host nginx on 172.22.1.1:8088
# Add wayda.co.tz to ADDITIONAL_SAN in mailcow.conf for ACME certs.

server {
    listen 80;
    listen [::]:80;
    server_name wayda.co.tz www.wayda.co.tz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wayda.co.tz www.wayda.co.tz;

    ssl_certificate /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12M;

    location / {
        proxy_pass http://172.22.1.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
