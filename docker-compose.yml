version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_URL=http://localhost:8000
      - AI_SERVICE_URL=http://ai-agent:8001
      - TRADING_SERVICE_URL=http://trading-engine:8002
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/var/www/html
    networks:
      - wayda

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - TRADING_ENGINE_URL=http://trading-engine:8002
      - RUNNER_ENABLED=false
    depends_on:
      - trading-engine
    networks:
      - wayda

  trading-engine:
    build:
      context: ./trading-engine
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - ./trading-engine/.env
    volumes:
      - trading_data:/app/data
    networks:
      - wayda
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - wayda

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wayda
      POSTGRES_USER: wayda
      POSTGRES_PASSWORD: wayda
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - wayda

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - wayda

volumes:
  pg_data:
  trading_data:

networks:
  wayda:
    driver: bridge
